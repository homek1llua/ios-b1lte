name: Probe jailbreak sources
on:
  push:
    paths: [.github/workflows/probe-jb.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set -x
          curl -sL -o bs.tar.zst https://static.palera.in/rootless/bootstrap-2000.tar.zst
          curl -sL -o sileo.deb https://github.com/Sileo/Sileo/releases/download/2.5.1/org.coolstar.sileo_2.5.1_iphoneos-arm64.deb
          mkdir s && sudo tar --zstd -xpf bs.tar.zst -C s
          sudo find s -maxdepth 3 | head -40
          sudo du -sh s; sudo find s | wc -l
          sudo find s -name 'prep_bootstrap*' -exec cat {} \;
          sudo cat s/var/jb/var/lib/dpkg/status | grep -c '^Package:'
          sudo grep -A2 '^Package: firmware\|^Package: apt$\|^Package: dpkg$' s/var/jb/var/lib/dpkg/status
          sudo ls -la s/var/jb s/var/jb/etc/apt/sources.list.d 2>/dev/null; sudo cat s/var/jb/etc/apt/sources.list.d/* 2>/dev/null
          dpkg-deb -I sileo.deb; dpkg-deb -c sileo.deb | head -30
          sudo find s -type f -perm -4000 | head
          sudo tar -tvf bs.tar.zst --zstd | head -5
          file s/var/jb/usr/bin/apt s/var/jb/bin/sh 2>/dev/null || sudo file s/var/jb/usr/bin/* | head -3
