name: Build iOS root + SYSTEM images

# USERDATA root (32 GiB HFS+) and SYSTEM image from Apple's iOS 26.6.2 IPSW.
# The images contain Apple's iOS files, so they are never uploaded as public
# artifacts: they go to a release in the private repo homek1llua/b1l-private
# (B1L_PRIVATE_TOKEN needs Contents: read and write there).
on:
  workflow_dispatch:
  push:
    branches: [ios-images]

jobs:
  images:
    runs-on: macos-26-intel
    timeout-minutes: 330
    env:
      PRIVATE_REPO: homek1llua/b1l-private
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo python3 -m pip install --break-system-packages remotezip cryptography
          brew install pigz
          df -h "$RUNNER_TEMP" | tail -1

      - name: Check private release access
        env:
          GH_TOKEN: ${{ secrets.B1L_PRIVATE_TOKEN }}
        run: gh release list -R "$PRIVATE_REPO" --limit 3

      - name: Build images
        run: sudo -E bash scripts/ci-build-ios-images.sh "$RUNNER_TEMP/ios"

      - name: Compress and split
        run: |
          w="$RUNNER_TEMP/ios"; up="$RUNNER_TEMP/upload"; sudo mkdir -p "$up"; sudo chown "$USER" "$up"
          sudo chown "$USER" "$w/out/ios26-userdata.hfs.img" "$w/system/b1l-system.img"
          for pair in "out/ios26-userdata.hfs.img:userdata" "system/b1l-system.img:system"; do
            src="$w/${pair%%:*}"; name="${pair##*:}"
            shasum -a 256 "$src" | sed "s|  .*|  $(basename "$src")|" >> "$up/SHA256SUMS.txt"
            tar -C "$(dirname "$src")" -cf - "$(basename "$src")" | pigz -6 | split -b 1900m -a 2 - "$up/$name.tar.gz.part-"
          done
          (cd "$up" && shasum -a 256 *.part-* >> SHA256SUMS.txt)
          ls -la "$up"; cat "$up/SHA256SUMS.txt"

      - name: Upload to private release
        env:
          GH_TOKEN: ${{ secrets.B1L_PRIVATE_TOKEN }}
        run: |
          tag="ios-images-23G90-r${{ github.run_number }}"
          gh release create "$tag" -R "$PRIVATE_REPO" --title "$tag" \
            --notes "iOS 26.6.2 (23G90) USERDATA root + SYSTEM image for the S10, from ${{ github.sha }}. Join the parts in order (copy /b), then tar -xzf." \
            "$RUNNER_TEMP"/upload/*
          echo "Uploaded to https://github.com/$PRIVATE_REPO/releases/tag/$tag"
