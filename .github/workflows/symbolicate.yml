name: Symbolicate crash addresses
# Looks up crash backtrace addresses (symbolicate.txt: "# label" lines, then one slid address per line) in the
# iOS 23G90 dyld shared cache, extracted from Apple's public IPSW with blacktop's ipsw tool.
on:
  workflow_dispatch:
    inputs:
      slide: { description: "shared cache slide", required: true, default: "0x19a2c000" }
  push:
    branches: [symbolicate]
jobs:
  symbolicate:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install ipsw
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          arch=$(uname -m); [ "$arch" = arm64 ] || arch=x86_64
          gh release download -R blacktop/ipsw -p "ipsw_*_macOS_${arch}.tar.gz" -D /tmp/ipswdl
          tar -xzf /tmp/ipswdl/*.tar.gz -C /tmp/ipswdl
          sudo install -m 755 "$(find /tmp/ipswdl -type f -name ipsw | head -1)" /usr/local/bin/ipsw
          ipsw version
      - name: Extract the dyld shared cache
        run: |
          set -euo pipefail
          url="https://updates.cdn-apple.com/2026SummerFCS/a1dbd14a-9e9d-49b3-9af6-02286d68883f/iPhone17,2_26.6.2_23G90_Restore.ipsw"
          mkdir -p cache
          ipsw extract --dyld --dyld-arch arm64e --remote "$url" -o cache
          find cache -name 'dyld_shared_cache_arm64e' -print
      - name: Symbolicate
        run: |
          set -euo pipefail
          dsc=$(find cache -name 'dyld_shared_cache_arm64e' | head -1)
          slide="${{ inputs.slide }}"; slide="${slide:-0x19a2c000}"; [ -f symbolicate.unslid ] && slide=0
          while read -r line; do
            case "$line" in
              "#"*) echo "$line";;
              0x*) unslid=$(printf '0x%x' $(( line - slide )))
                   sym=$(ipsw dyld a2s "$dsc" "$unslid" 2>&1 | tail -1 || true)
                   echo "$line -> $sym";;
            esac

          done < symbolicate.txt | tee symbols.txt
      - name: Disassemble functions (disassemble.txt, one symbol per line)
        run: |
          dsc=$(find cache -name 'dyld_shared_cache_arm64e' | head -1)
          [ -f disassemble.txt ] || exit 0
          while read -r sym; do
            [ -n "$sym" ] || continue
            echo "=== $sym"
            case "$sym" in
              0x*) name=$(ipsw dyld a2s "$dsc" "$sym" 2>&1 | tail -1); echo "($name)"
                   ipsw dyld disass "$dsc" --vaddr "$sym" --count 160 --quiet 2>&1 | head -400;;
              *) ipsw dyld disass "$dsc" --symbol "$sym" --quiet 2>&1 | head -400;;
            esac
          done < disassemble.txt | tee -a symbols.txt
      - name: List symbols (symbols-grep.txt holds an image and a pattern)
        run: |
          dsc=$(find cache -name 'dyld_shared_cache_arm64e' | head -1)
          [ -f symbols-grep.txt ] || exit 0
          read -r image pattern < symbols-grep.txt
          ipsw dyld symaddr "$dsc" --image "$image" 2>&1 | grep -a "$pattern" | head -200 | tee -a symbols.txt
      - uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: symbols.txt
