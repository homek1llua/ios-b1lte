name: Build SYSTEM image

# SYSTEM image only, for a given partition size, matched to an existing iOS root
# through its 4 KiB header (roots/<release>/root-header.bin in the private repo).
# With metal=true, a first job builds the GPU userspace (Mesa panfrost + Scion's Metal driver for the
# Mali, sets b2l-metal-v5 and b2l-metal-v95 that the kernel publishes) and SYSTEM gets them too.
on:
  push:
    branches: [system-image]
  workflow_dispatch:
    inputs:
      metal:
        description: Build and include the Metal GPU sets
        type: boolean
        default: true
      jb:
        description: Include the jailbreak payload (Procursus rootless bootstrap + Sileo, SYSTEM:/b2l-jb)
        type: boolean
        default: true

env:
  PRIVATE_REPO: homek1llua/b1l-private
  RELEASE_TAG: ios-images-23G90-r1
  SYSTEM_BYTES: "5976883200"   # sda25 on the owner's S10 (TWRP, 2026-11-20)
  CACHE_MIB: "4600"            # native cache; leaves ~1 GiB of HFS free

jobs:
  metal:
    if: ${{ inputs.metal }}
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      SCION_COMMIT: a6f4bc38aa244359cd365c976244a88c9d6b3304
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install meson ninja bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          xcodebuild -version; xcrun --sdk iphoneos --show-sdk-path

      - name: Scion reference (Mesa patches, AIR front end)
        run: |
          d="$HOME/Developer/s10-port/ref-scion/hackios-xnu-kernel"; mkdir -p "$d"
          git -C "$d" init -q; git -C "$d" remote add origin https://github.com/Scion-Project/hackios-xnu-kernel
          git -C "$d" fetch -q --depth 1 origin "$SCION_COMMIT"; git -C "$d" checkout -q FETCH_HEAD
          [[ "$(git -C "$d" rev-parse HEAD)" == "$SCION_COMMIT" ]]

      - name: Mesa (softpipe, panfrost) and libhakiosair
        run: bash scripts/build-mesa.sh || { tail -60 ~/Developer/s10-port/build-mesa/meson-setup.log ~/Developer/s10-port/build-mesa/ninja.log; exit 1; }

      - name: Metal sets
        run: |
          V=b2l-metal-v5 BUNDLE=B2LMetalV3 bash scripts/build-metal.sh
          V=b2l-metal-v95 bash scripts/build-metal-scion.sh
          ls -l ~/Developer/s10-port/build-metal/*/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: metal-sets
          path: |
            ~/Developer/s10-port/build-metal/b2l-metal-v5
            ~/Developer/s10-port/build-metal/b2l-metal-v95

  ign1te:
    # S10 build 0034: Ign1te, the jailbreak control panel (SwiftUI, built with Xcode)
    if: ${{ inputs.jb }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build Ign1te.app
        run: userspace/ign1te/build.sh "$RUNNER_TEMP/ign1te" && cd "$RUNNER_TEMP/ign1te" && tar -cf ign1te.tar Ign1te.app
      - uses: actions/upload-artifact@v4
        with:
          name: ign1te
          path: ${{ runner.temp }}/ign1te/ign1te.tar

  jb:
    needs: [ign1te]
    if: ${{ inputs.jb }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ign1te
          path: ign1te-art
      - name: Bootstrap and Sileo
        env:
          GH_TOKEN: ${{ secrets.B1L_PRIVATE_TOKEN }}
        run: |
          set -euo pipefail
          curl -sfL -o bs.tar.zst https://static.palera.in/rootless/bootstrap-2000.tar.zst
          curl -sfL -o sileo.deb https://github.com/Sileo/Sileo/releases/download/2.5.1/org.coolstar.sileo_2.5.1_iphoneos-arm64.deb
          sha256sum bs.tar.zst sileo.deb
          mkdir s && sudo tar --zstd -xpf bs.tar.zst -C s
          sudo dpkg-deb -x sileo.deb s
          sudo mkdir -p s/Applications
          sudo mv s/var/jb/Applications/Sileo.app s/Applications/Sileo.app
          st=s/var/jb/Library/dpkg/status
          ls -l "$st"
          # What prep_bootstrap's "firmware" would register, and Sileo itself as installed (its app is at
          # /Applications/Sileo.app on this port, a system app for LaunchServices)
          {
            echo
            for p in "firmware 26.6.2" "cy+os.ios 26.6.2" "cy+cpu.arm64 0" "cy+model.iphone 11.1" "cy+kernel.darwin 25.6.0"; do
              set -- $p
              printf 'Package: %s\nEssential: yes\nStatus: install ok installed\nPriority: required\nSection: System\nInstalled-Size: 0\nMaintainer: ios-b1lte\nArchitecture: iphoneos-arm64\nVersion: %s\nDescription: virtual package for the S10 port\n\n' "$1" "$2"
            done
            # S10 build 0030: libkrw0 (needed by many packages, 2048 among them) depends on libkrw0-plugin, the jailbreak's
            # kernel read/write plug-in; this port has no exploit to offer one, so a virtual package provides the name
            printf 'Package: b2l-libkrw0-plugin\nStatus: install ok installed\nPriority: optional\nSection: System\nInstalled-Size: 0\nMaintainer: ios-b1lte\nArchitecture: iphoneos-arm64\nVersion: 1.0\nProvides: libkrw0-plugin (= 1.1.1), mobilesubstrate (= 99.0), cydia-substrate (= 99.0), com.saurik.substrate.safemode, preferenceloader (= 99.0)\nDescription: virtual libkrw0-plugin for the S10 port\n\n'
            dpkg-deb -f sileo.deb | sed '/^$/d' | awk 'NR==1{print; print "Status: install ok installed"; next} {print}'
            echo
          } | sudo tee -a "$st" > /dev/null
          dpkg-deb -c sileo.deb | awk '{print $6}' | sed 's|^\./|/|; s|/$||; s|^/var/jb/Applications/Sileo.app|/Applications/Sileo.app|' | grep -v '^$' | sudo tee s/var/jb/Library/dpkg/info/org.coolstar.sileo.list > /dev/null
          grep -c '^Package:' "$st"
          # S10 build 0040: OpenSSH (Procursus) for the PC: key login only, host keys made here, started by Ign1te
          sudo python3 scripts/jb-add-packages.py s openssh-server openssh-sftp-server openssh-client
          sudo mkdir -p s/var/jb/etc/ssh s/var/jb/var/run s/var/jb/var/log s/var/jb/var/empty
          sudo ssh-keygen -q -t ed25519 -N "" -f s/var/jb/etc/ssh/ssh_host_ed25519_key
          sudo ssh-keygen -q -t rsa -b 3072 -N "" -f s/var/jb/etc/ssh/ssh_host_rsa_key
          sudo cp userspace/ssh/sshd_config userspace/ssh/authorized_keys s/var/jb/etc/ssh/
          sudo chown -R 0:0 s/var/jb/etc/ssh && sudo chmod 600 s/var/jb/etc/ssh/ssh_host_*_key && sudo chmod 644 s/var/jb/etc/ssh/authorized_keys
          ls -la s/var/jb/usr/sbin/sshd s/var/jb/etc/ssh
          # S10 build 0035: Zebra, the second package manager Ign1te offers (registered with LaunchServices only when
          # chosen there, by uicache); left out if no rootless build is found
          url=$(GH_TOKEN="${{ github.token }}" gh api repos/zbrateam/Zebra/releases -q '[.[].assets[]|select(.name|test("iphoneos-arm64\\.deb$"))][0].browser_download_url' 2>/dev/null || true)
          echo "Zebra: ${url:-none}"
          if [ -n "$url" ] && curl -sfL -o zebra.deb "$url"; then
            mkdir zx && dpkg-deb -x zebra.deb zx && za=$(find zx -maxdepth 5 -name 'Zebra.app' -type d | head -1)
            if [ -n "$za" ]; then
              sudo mkdir -p s/var/jb/Applications && sudo cp -a "$za" s/var/jb/Applications/Zebra.app
              sudo chown -R 0:0 s/var/jb/Applications/Zebra.app
              { dpkg-deb -f zebra.deb | sed '/^$/d' | awk 'NR==1{print; print "Status: install ok installed"; next} {print}'; echo; } | sudo tee -a "$st" > /dev/null
              ls -la s/var/jb/Applications/Zebra.app | head
            fi
          fi
          sudo ls -la s/Applications/Sileo.app/giveMeRoot || true; sudo find s -type f -perm -4000
          # What prep_bootstrap.sh would make: apt's state dirs (Sileo: "the folder apt.procurs.us_dists_..._Packages
          # doesn't exist"), and apt run as root (no _apt sandbox user to drop to on this port)
          ls -la s/var/jb/var s/var/jb/var/lib || true
          sudo mkdir -p s/var/jb/var/lib/apt/lists/partial s/var/jb/var/cache/apt/archives/partial s/var/jb/etc/apt/apt.conf.d s/var/jb/etc/apt/sources.list.d s/var/jb/var/log/apt
          # Sileo keeps its own copies of the repos' lists in /var/lib/apt/sileolists, written as mobile (0024's
          # "the folder havoc.app_._Packages doesn't exist")
          sudo mkdir -p s/var/jb/var/lib/apt/sileolists && sudo chown 501:501 s/var/jb/var/lib/apt/sileolists
          # S10 build 0035: Sileo showed "Unknown Bootstrap" / "Unknown jailbreak": the marker files a Procursus bootstrap and
          # a jailbreak leave (Sileo only knows named jailbreaks; Dopamine's rootless layout is the one this port follows)
          sudo touch s/var/jb/.procursus_strapped s/var/jb/.installed_dopamine
          # S10 build 0035: Sileo names its downloads by the jailbreak's view of /var/mobile (/var/jb/var/mobile/...);
          # an empty directory there left apt-key and the package downloads pointing at nothing
          sudo rmdir s/var/jb/var/mobile && sudo ln -s /var/mobile s/var/jb/var/mobile
          echo 'APT::Sandbox::User "root";' | sudo tee s/var/jb/etc/apt/apt.conf.d/00b2l-sandbox > /dev/null
          # S10 build 0027: Sileo found no package after a refresh -- repos whose signature gpgv cannot check here are
          # still used
          printf 'Acquire::AllowInsecureRepositories "true";\nAcquire::AllowDowngradeToInsecureRepositories "true";\nAPT::Get::AllowUnauthenticated "true";\n' | sudo tee s/var/jb/etc/apt/apt.conf.d/00b2l-insecure > /dev/null
          ls -la s/var/jb/etc/apt/trusted.gpg.d/ || true
          ls s/var/jb/etc/apt/sources.list.d/ && sudo cat s/var/jb/etc/apt/sources.list.d/* || true
          # S10 build 0034: Ign1te
          sudo tar -xf ign1te-art/ign1te.tar -C s/Applications/
          sudo chown -R 0:0 s/Applications/Ign1te.app && sudo chmod -R u+rwX,go+rX s/Applications/Ign1te.app
          ls -la s/Applications/Ign1te.app
          # S10 build 0026: Discord 354.0 (the user's decrypted IPA, b1l-private apps/) as a system app beside Sileo
          for i in 0 1 2; do gh api "repos/$PRIVATE_REPO/contents/apps/discord-354.0.ipa.part$i" -H "Accept: application/vnd.github.raw"; done > discord.ipa
          echo "$(gh api "repos/$PRIVATE_REPO/contents/apps/discord-354.0.ipa.sha256" -H "Accept: application/vnd.github.raw")  discord.ipa" | sha256sum -c
          mkdir dipa && unzip -q discord.ipa -d dipa
          sudo mv dipa/Payload/Discord.app s/Applications/Discord.app
          # S10 build 0027: 0026's Discord died in dyld (a library missing, namespace 6 code 1): the system libraries it
          # links are made weak, so one this port lacks (iAd, ...) no longer stops it at launch
          sudo python3 - s/Applications/Discord.app/Discord <<'PY'
          import struct, sys
          f = sys.argv[1]; d = bytearray(open(f, 'rb').read())
          assert struct.unpack_from('<I', d, 0)[0] == 0xfeedfacf
          n = struct.unpack_from('<I', d, 16)[0]; off = 32; made = 0
          for i in range(n):
              cmd, sz = struct.unpack_from('<II', d, off)
              if cmd == 0xC:
                  name = bytes(d[off + struct.unpack_from('<I', d, off + 8)[0]:off + sz]).split(b'\0')[0]
                  if name.startswith(b'/System/') or name.startswith(b'/usr/lib/'):
                      struct.pack_into('<I', d, off, 0x80000018); made += 1
              off += sz
          open(f, 'wb').write(d); print('weak-linked', made, 'system libraries')
          PY
          sudo chown -R 0:0 s/Applications/Discord.app && sudo chmod -R u+rwX,go+rX s/Applications/Discord.app
          sudo du -sh s/Applications/Discord.app
          mkdir -p out/b2l-jb
          sudo tar --format=gnu --numeric-owner -cpf jb.tar -C s var Applications
          ls -l jb.tar
          split -b 62914560 -d -a 1 jb.tar out/b2l-jb/jb.part
          ls -l out/b2l-jb; sha256sum jb.tar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jb
          path: out

  system:
    needs: [metal, jb]
    if: ${{ always() && (needs.metal.result == 'success' || needs.metal.result == 'skipped') && (needs.jb.result == 'success' || needs.jb.result == 'skipped') }}
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Metal sets (SYSTEM:/b2l-metal-v5, /b2l-metal-v95)
        if: ${{ inputs.metal }}
        uses: actions/download-artifact@v4
        with:
          name: metal-sets
          path: ${{ runner.temp }}/extra

      - name: Jailbreak payload (SYSTEM:/b2l-jb)
        if: ${{ inputs.jb }}
        uses: actions/download-artifact@v4
        with:
          name: jb
          path: ${{ runner.temp }}/extra

      - name: Root header
        env:
          GH_TOKEN: ${{ secrets.B1L_PRIVATE_TOKEN }}
        run: |
          gh api "repos/$PRIVATE_REPO/contents/roots/$RELEASE_TAG/root-header.bin" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/root-header.bin"
          [[ $(stat -f %z "$RUNNER_TEMP/root-header.bin") -eq 4096 ]]
          xxd -l 16 -s 1024 "$RUNNER_TEMP/root-header.bin"

      - name: Wi-Fi firmware (SYSTEM:/b2l-wifi)
        env:
          GH_TOKEN: ${{ secrets.B1L_PRIVATE_TOKEN }}
        run: |
          d="$RUNNER_TEMP/extra/b2l-wifi"; mkdir -p "$d"
          for f in fw.bin nvram.txt clm.blob bt.hcd; do
            gh api "repos/$PRIVATE_REPO/contents/wifi/$f" -H "Accept: application/vnd.github.raw" > "$d/$f"
          done
          shasum -a 256 "$d"/*
          echo "1676f46ce56b96f58dc70de08beaab4ab3362ee6dd751465a8d6a0023c3c54ad  $d/fw.bin" | shasum -a 256 -c

      - name: Build
        env:
          B2L_SYSTEM_EXTRA: ${{ runner.temp }}/extra
          B2L_ROOT: ${{ github.workspace }}
          B2L_PYTHON: python3
          B2L_ROOT_HEADER: ${{ runner.temp }}/root-header.bin
          B2L_SYSTEM_OUT: ${{ runner.temp }}/system
          B2L_SYSTEM_BYTES: ${{ env.SYSTEM_BYTES }}
          B2L_CACHE_MIB: ${{ env.CACHE_MIB }}
        run: bash tools/b1l/build-system-image.sh

      - name: Upload to private release
        env:
          GH_TOKEN: ${{ secrets.B1L_PRIVATE_TOKEN }}
        run: |
          s="$RUNNER_TEMP/system"; name="system-$SYSTEM_BYTES"
          tar -C "$s" -czf "$RUNNER_TEMP/$name.tar.gz" b1l-system.img
          (cd "$s" && shasum -a 256 b1l-system.img) > "$RUNNER_TEMP/$name.SHA256.txt"
          cat "$RUNNER_TEMP/$name.SHA256.txt"; ls -l "$RUNNER_TEMP/$name.tar.gz"
          gh release upload "$RELEASE_TAG" -R "$PRIVATE_REPO" --clobber "$RUNNER_TEMP/$name.tar.gz" "$RUNNER_TEMP/$name.SHA256.txt"
