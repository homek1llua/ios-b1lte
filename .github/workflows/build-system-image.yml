name: Build SYSTEM image

# SYSTEM image only, for a given partition size, matched to an existing iOS root
# through its 4 KiB header (roots/<release>/root-header.bin in the private repo).
# With metal=true, a first job builds the GPU userspace (Mesa panfrost + Scion's Metal driver for the
# Mali, sets b2l-metal-v5 and b2l-metal-v95 that the kernel publishes) and SYSTEM gets them too.
on:
  push:
    branches: [system-image]
  workflow_dispatch:
    inputs:
      metal:
        description: Build and include the Metal GPU sets
        type: boolean
        default: true
      jb:
        description: Include the jailbreak payload (Procursus rootless bootstrap + Sileo, SYSTEM:/b2l-jb)
        type: boolean
        default: true

env:
  PRIVATE_REPO: homek1llua/b1l-private
  RELEASE_TAG: ios-images-23G90-r1
  SYSTEM_BYTES: "5976883200"   # sda25 on the owner's S10 (TWRP, 2026-11-20)
  CACHE_MIB: "4600"            # native cache; leaves ~1 GiB of HFS free

jobs:
  metal:
    if: ${{ inputs.metal }}
    runs-on: macos-26-intel
    timeout-minutes: 120
    env:
      SCION_COMMIT: a6f4bc38aa244359cd365c976244a88c9d6b3304
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install meson ninja bison flex
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          xcodebuild -version; xcrun --sdk iphoneos --show-sdk-path

      - name: Scion reference (Mesa patches, AIR front end)
        run: |
          d="$HOME/Developer/s10-port/ref-scion/hackios-xnu-kernel"; mkdir -p "$d"
          git -C "$d" init -q; git -C "$d" remote add origin https://github.com/Scion-Project/hackios-xnu-kernel
          git -C "$d" fetch -q --depth 1 origin "$SCION_COMMIT"; git -C "$d" checkout -q FETCH_HEAD
          [[ "$(git -C "$d" rev-parse HEAD)" == "$SCION_COMMIT" ]]

      - name: Mesa (softpipe, panfrost) and libhakiosair
        run: bash scripts/build-mesa.sh || { tail -60 ~/Developer/s10-port/build-mesa/meson-setup.log ~/Developer/s10-port/build-mesa/ninja.log; exit 1; }

      - name: Metal sets
        run: |
          V=b2l-metal-v5 BUNDLE=B2LMetalV3 bash scripts/build-metal.sh
          V=b2l-metal-v95 bash scripts/build-metal-scion.sh
          ls -l ~/Developer/s10-port/build-metal/*/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: metal-sets
          path: |
            ~/Developer/s10-port/build-metal/b2l-metal-v5
            ~/Developer/s10-port/build-metal/b2l-metal-v95

  jb:
    if: ${{ inputs.jb }}
    runs-on: ubuntu-24.04
    steps:
      - name: Bootstrap and Sileo
        run: |
          set -euo pipefail
          curl -sfL -o bs.tar.zst https://static.palera.in/rootless/bootstrap-2000.tar.zst
          curl -sfL -o sileo.deb https://github.com/Sileo/Sileo/releases/download/2.5.1/org.coolstar.sileo_2.5.1_iphoneos-arm64.deb
          sha256sum bs.tar.zst sileo.deb
          mkdir s && sudo tar --zstd -xpf bs.tar.zst -C s
          sudo dpkg-deb -x sileo.deb s
          sudo mkdir -p s/Applications
          sudo mv s/var/jb/Applications/Sileo.app s/Applications/Sileo.app
          st=s/var/jb/Library/dpkg/status
          ls -l "$st"
          # What prep_bootstrap's "firmware" would register, and Sileo itself as installed (its app is at
          # /Applications/Sileo.app on this port, a system app for LaunchServices)
          {
            echo
            for p in "firmware 26.6.2" "cy+os.ios 26.6.2" "cy+cpu.arm64 0" "cy+model.iphone 11.1" "cy+kernel.darwin 25.6.0"; do
              set -- $p
              printf 'Package: %s\nEssential: yes\nStatus: install ok installed\nPriority: required\nSection: System\nInstalled-Size: 0\nMaintainer: ios-b1lte\nArchitecture: iphoneos-arm64\nVersion: %s\nDescription: virtual package for the S10 port\n\n' "$1" "$2"
            done
            dpkg-deb -f sileo.deb | sed '/^$/d' | awk 'NR==1{print; print "Status: install ok installed"; next} {print}'
            echo
          } | sudo tee -a "$st" > /dev/null
          dpkg-deb -c sileo.deb | awk '{print $6}' | sed 's|^\./|/|; s|/$||; s|^/var/jb/Applications/Sileo.app|/Applications/Sileo.app|' | grep -v '^$' | sudo tee s/var/jb/Library/dpkg/info/org.coolstar.sileo.list > /dev/null
          grep -c '^Package:' "$st"
          sudo ls -la s/Applications/Sileo.app | head; sudo find s -type f -perm -4000
          mkdir -p out/b2l-jb
          sudo tar --format=gnu --numeric-owner -cpf jb.tar -C s var Applications
          ls -l jb.tar
          split -b 62914560 -d -a 1 jb.tar out/b2l-jb/jb.part
          ls -l out/b2l-jb; sha256sum jb.tar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: jb
          path: out

  system:
    needs: [metal, jb]
    if: ${{ always() && (needs.metal.result == 'success' || needs.metal.result == 'skipped') && (needs.jb.result == 'success' || needs.jb.result == 'skipped') }}
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Metal sets (SYSTEM:/b2l-metal-v5, /b2l-metal-v95)
        if: ${{ inputs.metal }}
        uses: actions/download-artifact@v4
        with:
          name: metal-sets
          path: ${{ runner.temp }}/extra

      - name: Jailbreak payload (SYSTEM:/b2l-jb)
        if: ${{ inputs.jb }}
        uses: actions/download-artifact@v4
        with:
          name: jb
          path: ${{ runner.temp }}/extra

      - name: Root header
        env:
          GH_TOKEN: ${{ secrets.B1L_PRIVATE_TOKEN }}
        run: |
          gh api "repos/$PRIVATE_REPO/contents/roots/$RELEASE_TAG/root-header.bin" -H "Accept: application/vnd.github.raw" > "$RUNNER_TEMP/root-header.bin"
          [[ $(stat -f %z "$RUNNER_TEMP/root-header.bin") -eq 4096 ]]
          xxd -l 16 -s 1024 "$RUNNER_TEMP/root-header.bin"

      - name: Wi-Fi firmware (SYSTEM:/b2l-wifi)
        env:
          GH_TOKEN: ${{ secrets.B1L_PRIVATE_TOKEN }}
        run: |
          d="$RUNNER_TEMP/extra/b2l-wifi"; mkdir -p "$d"
          for f in fw.bin nvram.txt clm.blob bt.hcd; do
            gh api "repos/$PRIVATE_REPO/contents/wifi/$f" -H "Accept: application/vnd.github.raw" > "$d/$f"
          done
          shasum -a 256 "$d"/*
          echo "1676f46ce56b96f58dc70de08beaab4ab3362ee6dd751465a8d6a0023c3c54ad  $d/fw.bin" | shasum -a 256 -c

      - name: Build
        env:
          B2L_SYSTEM_EXTRA: ${{ runner.temp }}/extra
          B2L_ROOT: ${{ github.workspace }}
          B2L_PYTHON: python3
          B2L_ROOT_HEADER: ${{ runner.temp }}/root-header.bin
          B2L_SYSTEM_OUT: ${{ runner.temp }}/system
          B2L_SYSTEM_BYTES: ${{ env.SYSTEM_BYTES }}
          B2L_CACHE_MIB: ${{ env.CACHE_MIB }}
        run: bash tools/b1l/build-system-image.sh

      - name: Upload to private release
        env:
          GH_TOKEN: ${{ secrets.B1L_PRIVATE_TOKEN }}
        run: |
          s="$RUNNER_TEMP/system"; name="system-$SYSTEM_BYTES"
          tar -C "$s" -czf "$RUNNER_TEMP/$name.tar.gz" b1l-system.img
          (cd "$s" && shasum -a 256 b1l-system.img) > "$RUNNER_TEMP/$name.SHA256.txt"
          cat "$RUNNER_TEMP/$name.SHA256.txt"; ls -l "$RUNNER_TEMP/$name.tar.gz"
          gh release upload "$RELEASE_TAG" -R "$PRIVATE_REPO" --clobber "$RUNNER_TEMP/$name.tar.gz" "$RUNNER_TEMP/$name.SHA256.txt"
